# Cinder — kitty theme
#
# Warm charcoal ground with volcanic accents. Palette is the single source of
# truth shared with the Zed theme in ~/.config/zed/themes/cinder.json
# (terminal.* / terminal.ansi.* keys), so kitty and Zed's embedded terminal
# render identically.
#
#   ground   #1a1715  warm near-black, hue ~35°, chroma kept under 0.01
#   ink      #e6ddd3  warm off-white
#   ember    #ea904d  the one identity accent — cursor, marks, active bits
#
# Accents sit in a narrow lightness band (L* 65–72) on purpose: nothing in the
# palette shouts louder than its neighbour, so scanning a wall of output stays
# cheap. Ember is the exception and is reserved for "where am I" affordances.

#: Fonts {{{

# Maple Mono, rounded bowls and a single-storey a. Its l carries a tail, which
# is what keeps l apart from 1 and I. Metrics are identical to JetBrains Mono
# (advance 15.59, x-height 15.0, cap 20.0 at 26px all match), so the swap is
# drop-in and font_size below did not need retuning.
#
# Watch the family name. kitty only accepts strictly monospaced faces and falls
# back to Menlo without a word when the name misses, which is what the plain
# "JetBrainsMono Nerd Font" did here — its icons are 1.5 cells wide.
font_family      family="Maple Mono NF" style=Medium
bold_font        family="Maple Mono NF" style=Bold
italic_font      family="Maple Mono NF" style="Medium Italic"
bold_italic_font family="Maple Mono NF" style="Bold Italic"

font_size 13.0
modify_font cell_height 140%

# Weight comes from the Medium face above, not from a composition tweak:
# text_composition_strategy is left at its default (platform), which already
# applies macOS-native gamma and contrast.

# Ligatures on, but never inside the cell under the cursor.
disable_ligatures cursor

#: }}}

#: Opacity {{{

# Deliberately opaque. A translucent ground adds a second depth layer that
# makes the room's reflection easier to pick out on a glossy panel.
background_opacity 1.0
dynamic_background_opacity no

#: }}}

#: Base colors {{{

background            #1a1715
foreground            #e6ddd3
selection_background  #3f342b
selection_foreground  #f2ebe3

cursor                #f5964e
cursor_text_color     #1a1715
cursor_shape          block
cursor_blink_interval 0
# Хвост за курсором. Тройка — это миллисекунды простоя, а не длительность:
# след тянется только за курсором, простоявшим на месте дольше этого времени,
# что отсекает служебные перескоки при перерисовке TUI. Порог запуска задаёт
# cursor_trail_start_threshold (дефолт 2 ячейки) — поэтому посимвольный набор
# следа не оставляет, а прыжок на другую строку оставляет.
#
# Цвет хвоста не задан: при cursor_trail_color=none он берётся от фона курсора,
# то есть от ember выше. Значения decay ниже равны дефолту kitty и оставлены
# явно как ручка: два числа — минимальное и максимальное время затухания в
# секундах, меньше значит быстрее.
cursor_trail          3
cursor_trail_decay    0.1 0.4

url_color             #6fb9a5
url_style             dotted

visual_bell_color     #ea904d
bell_border_color     #ea904d

#: }}}

#: ANSI palette {{{

# black
color0  #241f1c
color8  #4a423b
# red
color1  #ea8073
color9  #ee978c
# green
color2  #9bb46e
color10 #aac579
# yellow
color3  #d4aa60
color11 #e8ba69
# blue
color4  #81abcc
color12 #8dbbe0
# magenta
color5  #c992bc
color13 #dda0cf
# cyan
color6  #6fb9a5
color14 #79cab5
# white
color7  #d8cdc2
color15 #f2ebe3

#: }}}

#: Window chrome {{{

active_border_color   #8a6440
inactive_border_color #2f2925

inactive_text_alpha 0.7

# Ноль, а не отступ: паддинг заливается цветом background, который светлее
# тёмного хрома nvim и Zed (#14110f), поэтому любой отступ читается как светлая
# рамка вокруг панелей. Содержимое идёт от края до края.
window_padding_width 0

# Когда высота окна не кратна высоте ячейки, остаток некуда деть: kitty не
# нарисует пол-строки. По умолчанию она делит его пополам и он вылезает и
# сверху, и снизу. top-left прижимает сетку к верху: таб-бар ложится ровно на
# верхнюю кромку, а остаток уходит вниз и вправо. Обе эти кромки граничат с
# фоном редактора #1a1715, тем же, каким залит остаток, поэтому он не виден
# нигде — при вкладках снизу так свести не получалось.
placement_strategy top-left

hide_window_decorations titlebar-only
macos_titlebar_color background

# The split line is the only chrome between panes, so it gets the ember
# accent on the focused side and disappears everywhere else.
window_border_width 1pt
draw_minimal_borders yes

#: }}}

#: Tab bar {{{

# Flat butted blocks, no powerline slants: the ground is warm enough that
# added geometry just becomes noise.
#
# Бар наверху: активная вкладка залита фоном редактора (#1a1715) и лежит прямо
# над содержимым того же цвета — вкладка буквально раскрывается в то, что под
# ней. Снизу эта метафора не работала: там под активной вкладкой была кромка
# окна.
tab_bar_style               separator
tab_separator               " "
tab_bar_edge                top
tab_bar_margin_height       0.0 0.0
tab_title_template          " {index}·{title} "
active_tab_title_template   " {index}·{title} "

active_tab_background       #1a1715
active_tab_foreground       #ea904d
active_tab_font_style       bold

inactive_tab_background     #14110f
inactive_tab_foreground     #786d63
inactive_tab_font_style     normal

tab_bar_background          #14110f
tab_bar_margin_color        #14110f

#: }}}

#: Marks {{{

mark1_foreground #1a1715
mark1_background #ea904d
mark2_foreground #1a1715
mark2_background #6fb9a5
mark3_foreground #1a1715
mark3_background #c992bc

#: }}}
