# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# General
set -g mouse on
set -g history-limit 10000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# Kitty / true colour
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"

# Fast pane navigation with Alt + arrows
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Splits — always 50/50, keep the current working directory
#   C-a [   side by side  (divider runs vertically)
#   C-a ]   stacked       (divider runs horizontally)
bind '[' split-window -h -c "#{pane_current_path}"
bind ']' split-window -v -c "#{pane_current_path}"

# Same thing on the mnemonic keys
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"

# [ is taken by the split above, so copy mode moves to Escape (PgUp also works)
bind Escape copy-mode

# Dim Glass — same palette as ~/.config/kitty/dim-glass.conf
#
# Panes deliberately have no window-style set: they inherit the terminal's own
# default background (#24282d in kitty), so tmux never fights the terminal and
# stays correct in any other terminal too.

# Status bar sits on the chrome shade, one step below the pane background
set -g status-style "bg=#1f2327,fg=#9aa1a9"
setw -g window-status-style "bg=#1f2327,fg=#7c848e"
setw -g window-status-current-style "bg=#2f353b,fg=#dfe3e8"
setw -g window-status-activity-style "bg=#1f2327,fg=#d3ae7a"
setw -g window-status-bell-style "bg=#1f2327,fg=#d08c86"
setw -g window-status-separator ""

# Mockup pads its tab labels generously — same idea here, so the active block
# reads as a tab rather than as a highlighted word
setw -g window-status-format         "  #I #W  "
setw -g window-status-current-format "  #I #W  "

set -g status-left-style "fg=#7c848e"
set -g status-right-style "fg=#7c848e"

# Pane borders match kitty's active/inactive window borders
set -g pane-border-style "fg=#31373e"
set -g pane-active-border-style "fg=#4a525b"

# Prompts, messages, copy mode
set -g message-style "bg=#2b3035,fg=#dfe3e8"
set -g message-command-style "bg=#2b3035,fg=#dfe3e8"
setw -g mode-style "bg=#3a4149,fg=#dfe3e8"
set -g clock-mode-colour "#d3ae7a"
set -g display-panes-colour "#4e565f"
set -g display-panes-active-colour "#d3ae7a"

set -g set-titles on
set -g set-titles-string '#{b:pane_current_path}'
