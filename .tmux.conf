# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# General
set -g mouse on
set -g history-limit 10000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# Kitty / true colour
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"

# Fast pane navigation with Alt + arrows
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Splits — always 50/50, keep the current working directory
#   C-a [   side by side  (divider runs vertically)
#   C-a ]   stacked       (divider runs horizontally)
bind '[' split-window -h -c "#{pane_current_path}"
bind ']' split-window -v -c "#{pane_current_path}"

# Same thing on the mnemonic keys
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"

# [ is taken by the split above, so copy mode moves to Escape (PgUp also works)
bind Escape copy-mode

# Cinder — та же палитра, что в ~/.config/kitty/cinder.conf,
# ~/.config/zed/themes/cinder.json и ~/.config/nvim/colors/cinder.lua.
#
# Панелям намеренно не задан window-style: они наследуют фон самого терминала
# (#1a1715 в kitty), поэтому tmux не спорит с терминалом и остаётся корректным
# в любом другом.

# Строка статуса стоит на тёмном оттенке хрома — том же, каким залит таб-бар
# kitty и нижняя строка nvim
set -g status-style "bg=#14110f,fg=#a1968b"
setw -g window-status-style "bg=#14110f,fg=#786d63"

# Активное окно берёт фон панели, ровно как активная вкладка в kitty: блок
# того же цвета, что содержимое над ним, и потому читается как «текущее»
setw -g window-status-current-style "bg=#1a1715,fg=#ea904d,bold"
setw -g window-status-activity-style "bg=#14110f,fg=#d4aa60"
setw -g window-status-bell-style "bg=#14110f,fg=#ea8073"
setw -g window-status-separator ""

# Метки вкладок с воздухом по бокам, чтобы активная читалась блоком, а не
# просто подсвеченным словом
setw -g window-status-format         "  #I #W  "
setw -g window-status-current-format "  #I #W  "

set -g status-left-style "fg=#786d63"
set -g status-right-style "fg=#786d63"

# Границы панелей повторяют границы окон kitty
set -g pane-border-style "fg=#2f2925"
set -g pane-active-border-style "fg=#8a6440"

# Подсказки, сообщения, режим копирования
set -g message-style "bg=#201c19,fg=#e6ddd3"
set -g message-command-style "bg=#201c19,fg=#e6ddd3"
setw -g mode-style "bg=#3f342b,fg=#f2ebe3"
set -g clock-mode-colour "#ea904d"
set -g display-panes-colour "#5c5249"
set -g display-panes-active-colour "#ea904d"

set -g set-titles on
set -g set-titles-string '#{b:pane_current_path}'
