# AeroSpace used only for workspaces; windows stay floating.
config-version = 2
auto-reload-config = true

# This is required by AeroSpace for the workspace root, but every window
# is immediately made floating by the callback below.
default-root-container-layout = 'tiles'

on-window-detected = [
  { if = 'true', run = 'layout floating' },
]

# Keep the main workspace on the main display and reserve workspace 6
# for the external display when one is connected.
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = 'main'
6 = 'secondary'

[mode.main.binding]

# Switch workspaces
alt-1 = 'workspace --auto-back-and-forth 1'
alt-2 = 'workspace --auto-back-and-forth 2'
alt-3 = 'workspace --auto-back-and-forth 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move the focused window to a workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# Return to the previous workspace
alt-tab = 'workspace-back-and-forth'
